name: SparkBot ES Jarvis

on:
  push:
    branches:
      - ci/sparkbot-es
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Las claves de IA vienen de los secretos del repositorio y nunca se guardan en el código
      - name: Write AI keys
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          printf '#pragma once\n#define GEMINI_API_KEY "%s"\n#define GROQ_API_KEY "%s"\n' \
            "$GEMINI_API_KEY" "$GROQ_API_KEY" > main/boards/espressif/esp-sparkbot/secrets.h

      - name: Build SparkBot
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py espressif/esp-sparkbot --language es-ES --wake-word wn9_jarvis_tts

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: sparkbot-es-jarvis
          path: build/merged-binary.bin
          if-no-files-found: error
          retention-days: 3
